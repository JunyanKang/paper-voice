name: Windows runtime and Zotero validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: python scripts/build_windows.py
      - name: Test in official Windows Zotero
        run: python scripts/test_windows_zotero.py
      - name: Save test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-evidence
          retention-days: 3
          path: |
            test-results/*.json
            test-results/*.log
            test-results/startup-error.txt
            test-results/harness-stage.txt
      - name: Save validated runtime
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime
          retention-days: 3
          path: dist/Paper Voice Windows
