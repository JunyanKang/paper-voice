name: Build Windows distribution
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v4
        with:
          path: .build/downloads
          key: windows-voice-downloads-v1
      - run: python scripts/build_windows.py
      - name: Verify offline voices in all four languages
        shell: python
        run: |
          import subprocess, json, base64, io, wave
          p = subprocess.Popen(['dist/Paper Voice Windows/engine/python/python.exe', '-E', '-s', '-B', '-X', 'utf8', 'dist/Paper Voice Windows/engine/worker.py'], stdin=subprocess.PIPE, stdout=subprocess.PIPE, text=True, encoding='utf-8')
          try:
              ready = json.loads(p.stdout.readline())
              assert ready['languages'] == ['en', 'zh', 'ja', 'fr']
              for voice, text in [('af_heart', 'The retina transforms light into signals.'), ('zf_xiaobei', '视网膜将光线转化为神经信号。'), ('jf_alpha', '網膜は光を神経信号に変換します。'), ('ff_siwis', 'La rétine transforme la lumière en signaux nerveux.')]:
                  p.stdin.write(json.dumps(dict(text=text, voice=voice, rate=1)) + '\n'); p.stdin.flush()
                  result = json.loads(p.stdout.readline())
                  assert result['ok'], result
                  with wave.open(io.BytesIO(base64.b64decode(result['audio']))) as audio:
                      assert audio.getframerate() == 24000 and audio.getnframes() > 24000
                  print(voice, 'offline synthesis passed', result['duration'])
          finally:
              p.stdin.close(); p.wait(timeout=15)
      - run: python scripts/build_installer.py
      - run: python scripts/build.py
      - run: python scripts/package_release.py --platform Windows-x64
      - name: Verify packaged installation
        shell: pwsh
        run: |
          $version = (Get-Content addon/manifest.json | ConvertFrom-Json).version
          $target = Join-Path $env:RUNNER_TEMP 'Paper Voice 安装验证'
          Expand-Archive "dist/Paper-Voice-$version-Windows-x64.zip" $target
          $env:APPDATA = Join-Path $target '独立用户'
          $exe = Join-Path $target 'Paper Voice/Paper Voice Setup.exe'
          $log = Join-Path $env:RUNNER_TEMP 'installer.log'
          $process = Start-Process $exe -ArgumentList @('/quiet', $log) -PassThru -Wait
          Get-Content $log
          if ($process.ExitCode -ne 0) { throw 'Packaged installer failed' }
          if (!(Test-Path "$env:APPDATA/Zotero/Zotero/paper-voice-engine/models/kokoro-v1.0.onnx")) { throw 'Voice model missing' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-distribution
          include-hidden-files: true
          retention-days: 3
          path: |
            .build/installers/Paper Voice Setup.exe
            dist/Paper-Voice-*-Windows-x64.zip
