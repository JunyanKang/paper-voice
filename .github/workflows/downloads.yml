name: Publish download service
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: paper-voice-downloads
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Obtain validated voice runtimes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.3.10 --pattern 'Paper-Voice-1.3.10-*.zip' --dir dist
      - run: python scripts/prepare_downloads.py
      - run: git diff --exit-code -- installers/runtime-*.json
      - run: python scripts/build.py
      - run: python scripts/release_metadata.py
      - run: python scripts/stage_distribution.py --preserve-published
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .build/download-site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: publish
