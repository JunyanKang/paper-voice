name: Validate download installers
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch validated runtime
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then platform=Windows-x64; else platform=macOS-arm64; fi
          gh release download v1.3.10 --pattern "Paper-Voice-1.3.10-$platform.zip" --dir dist
          python scripts/prepare_downloads.py --platform "$platform"
      - run: git diff --exit-code -- installers/runtime-*.json
      - run: python scripts/build.py
      - run: python scripts/release_metadata.py
      - run: python scripts/build_installer.py
      - run: python scripts/validate_installation.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: installers-${{ matrix.os }}
          path: |
            dist/Paper-Voice-*.dmg
            dist/Paper-Voice-*.exe
            .build/online-installers/*.png
            .build/online-installers/test-report.json
